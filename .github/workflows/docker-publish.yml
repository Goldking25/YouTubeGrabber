name: docker-publish

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/goldking25/youtubegrabber:latest
            ghcr.io/goldking25/youtubegrabber:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=YouTubeGrabber
            org.opencontainers.image.description=Friendly YouTube downloader web UI (MP4/MP3, queue, pause/resume)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
